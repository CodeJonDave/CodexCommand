<svg xmlns="http://www.w3.org/2000/svg" width="48" height="1080" viewBox="0 0 48 1080">
  <defs>
    <style>
      .panel-bg { fill:#161C22; }
      .surface { fill:#1B232B; }
      .border { stroke:#2B3640; stroke-width:1; fill:none; shape-rendering:crispEdges; }
      .divider { stroke:#2B3640; stroke-width:1; shape-rendering:crispEdges; }
      .rail { fill:#2F6B3F; }
      .slot { fill:#101418; stroke:#2B3640; stroke-width:1; }
    </style>
  </defs>

  <!-- Structural rail -->
  <rect class="rail" x="0" y="0" width="4" height="1080"/>

  <!-- Main panel -->
  <rect class="panel-bg" x="4" y="0" width="44" height="1080"/>
  <rect class="border" x="4.5" y="0.5" width="43" height="1079"/>

  <!-- Launcher zone -->
  <rect class="slot" x="10" y="10" width="32" height="32"/>

  <!-- Zone dividers -->
  <line class="divider" x1="4" y1="60.5" x2="48" y2="60.5"/>
  <line class="divider" x1="4" y1="620.5" x2="48" y2="620.5"/>
  <line class="divider" x1="4" y1="900.5" x2="48" y2="900.5"/>
</svg>
