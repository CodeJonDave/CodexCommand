<svg xmlns="http://www.w3.org/2000/svg" width="360" height="26" viewBox="0 0 360 26">
  <defs>
    <style>
      .surface { fill:#1B232B; }
      .border { stroke:#2B3640; stroke-width:1; fill:none; shape-rendering:crispEdges; }
      .primary { fill:#D8DEE9; font-family:"Inter","Noto Sans",sans-serif; font-size:11px; font-weight:600; }
      .secondary { fill:#AAB4C0; font-family:"Inter","Noto Sans",sans-serif; font-size:10px; font-weight:500; }
    </style>
