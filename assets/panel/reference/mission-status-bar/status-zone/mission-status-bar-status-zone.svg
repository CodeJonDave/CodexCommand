  <text class="secondary" x="20" y="18">AUD</text>
  <text class="primary" x="72" y="18">24:00:00</text>
  <text class="secondary" x="150" y="18">VPN</text>
  <text class="secondary" x="204" y="18">NET</text>
  <text class="secondary" x="258" y="18">NTF</text>
